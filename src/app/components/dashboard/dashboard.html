<div class="admin-layout">
  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" [class.show]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <div class="sidebar" [class.show]="isMobileMenuOpen">
    <div
      class="sidebar-header"
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 8px;
      "
    >
      <div class="sidebar-title" style="padding: 0; margin: 0">Admin Panel</div>
      <button
        class="close-mobile-menu"
        (click)="closeMobileMenu()"
        style="
          display: none;
          background: none;
          border: none;
          color: #94a3b8;
          font-size: 18px;
          cursor: pointer;
          padding: 4px;
        "
      >
        <i class="bi bi-times"></i>
      </button>
    </div>
    <div class="">
      <div>
    <button class="slink" [ngClass]="activateDashboard ? 'active' : ''" (click)="goTo('dashboard')">
      <i class="pi pi-th-large"></i> Dashboard
    </button>
    <button class="slink" [ngClass]="activeEvents ? 'active' : ''" (click)="goTo('events')">
      <i class="pi pi-calendar"></i> Events
    </button>
    <button class="slink" [ngClass]="activateOrders ? 'active' : ''" (click)="goTo('orders')">
      <i class="pi pi-shopping-cart"></i> Orders
    </button>
    </div>
    <div class="logout-btn" >
      <button
        class="slink logout"
        [ngClass]="activateLogout ? 'active' : ''"
        (click)="goTo('logout')"
      >
        <i class="bi bi-box-arrow-in-left"></i> Logout
      </button>
    </div>
    </div>
  </div>
  <div class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Dashboard</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 2px">
          Welcome back — here's what's happening
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-sm">
        <i class="pi pi-plus"></i> New Event
      </button>
    </div>
    <div class="cards">
      <div class="card stat-card">
        <div class="stat-icon" style="background-color: #eef3ff">&#x1F4B0;</div>
        <div class="stat-val">KES 4300</div>
        <div class="stat-lbl">Total revenue</div>
        <div class="stat-trend"><i class="bi bi-arrow-up"></i> 12% this month</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background-color: #dcfce7">&#x1F39F;&#xFE0F;</div>
        <div class="stat-val">128</div>
        <div class="stat-lbl">Tickets sold</div>
        <div class="stat-trend"><i class="bi bi-arrow-up"></i> 8 this week</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background-color: #f0fdf4">
     &#x2705;
        </div>
        <div class="stat-val">47</div>
        <div class="stat-lbl">Paid orders</div>
        <div class="stat-trend" style="color: #94a3b8">3 pending</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background-color: #fef9c3">&#x1F4C5;</div>
        <div class="stat-val">3</div>
        <div class="stat-lbl">Active events</div>
        <div class="stat-trend" style="color: #94a3b8">1 inactive</div>
      </div>
    </div>
<div class="row g-3"> 
  
  <!-- Column 1: Main content area-->
  <div class="col-12  col-lg-8">
      <div class="section-card h-100">
    <div class="section-head">
      <div class="section-head-title">Recent order</div>
      <button
        type="button"
        class="btn btn-outline btn-sm"
        style="padding: 5px 12px; font-size: 12px; border-radius: 6px"
        (click)="goTo('orders')"
      >
        View all
      </button>
    </div>
    </div>
  </div>

  <!-- Column 2 -->
  <div class="col-12 col-lg-4">
    <div class="section-card h-100">
    <div class="section-head">
      <div class="section-head-title">Your events</div>
      <button
        type="button"
        class="btn btn-outline btn-sm"
        style="padding: 5px 12px; font-size: 12px; border-radius: 6px"
        (click)="goTo('events')"
      >
        Manage<i class="pi pi-arrow-right"></i>
      </button>
    </div>
    <!-- event list -->
     <div class="d-flex align-items-center justify-content-between list-div" style="padding:10px;border-radius: 8px;cursor:pointer;transition: background 0.1s;" >
      
      <div class="d-block">
<div class="" style="font-size:12px;font-weight:500">Summer rooftop party</div>
<div class="text-secondary" style="font-size:11px;">august</div>
      </div>
        <div class="" style="padding: 3px 10px;
  
    border-radius: 50% !important;
    font-size: 11px;
    font-weight: 500;
        display: inline-flex;
    align-items: center;">
          <span class="tag-green">Active</span>
      </div>
     </div>
  </div>

</div>
</div> 

    </div>
