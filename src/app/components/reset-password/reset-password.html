<div class="login-screen d-flex align-items-center justify-content-center" style="background: #f8fafc">
  <div style="background-color: #ffffff; width: 360px; height: auto; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 24px rgba(0,0,0,0.06); padding: 32px;">

    <!-- Header -->
    <div style="text-align: center">
      <img alt="lock" src="/lock.png" style="width: 60px; height: 60px; object-fit: contain" />
    </div>
    <div style="margin-bottom: 24px; text-align: center">
      <div style="font-size: 17px; font-weight: 500; margin-bottom: 4px">Reset Password</div>
      <div style="font-size: 13px; color: #64748b">EventHub dashboard</div>
    </div>

    <form [formGroup]="forgotPasswordForm">

      <!-- Email field — always visible -->
      <div class="form-group" style="margin-bottom: 8px; padding: 0 10px">
        <label for="email" class="form-label" style="font-size: 12px; color: #64748b">Email</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="Enter your admin email"
          id="email"
        />
        @if (forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched) {
          <div class="text-danger" style="font-size: 11px; margin-top: 4px">Enter a valid email address</div>
        }
      </div>

      <!-- Back to login link -->
      <div class="d-flex justify-content-end" style="padding: 0 10px; margin-bottom: 16px">
        <button type="button" class="btn btn-link text-danger text-decoration-none" style="font-size: 12px;" (click)="routeToLogin()">
          Remembered your password?
        </button>
      </div>

      <!-- Send OTP button — shown only before OTP is sent -->
      @if (!otpSent()) {
        <div style="padding: 0 10px; margin-bottom: 16px">
          <button
            type="button"
            class="btn btn-primary d-inline-flex justify-content-center align-items-center"
            style="background: #1a56db; width: 100%; height: 32px; font-size: 13px; font-weight: 500; gap: 6px;"
            (click)="verifyEmailAndsendOtp()"
          >
            Send OTP <i class="bi bi-arrow-right pt-1"></i>
          </button>
        </div>
      }

      <!-- Password + OTP fields — shown only after OTP is sent -->
      @if (otpSent()) {
        <div class="form-group" style="margin-bottom: 16px; padding: 0 10px">
          <label for="newPassword" class="form-label" style="font-size: 12px; color: #64748b">New Password</label>
          <input
            type="password"
            formControlName="newPassword"
            class="form-control"
            placeholder="Create a new password"
            id="newPassword"
          />
        </div>

        <div class="form-group" style="margin-bottom: 16px; padding: 0 10px">
          <label for="confirmPassword" class="form-label" style="font-size: 12px; color: #64748b">Confirm Password</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="form-control"
            placeholder="Confirm your new password"
            id="confirmPassword"
          />
        </div>

        <div class="form-group" style="margin-bottom: 16px; padding: 0 10px">
          <label for="otp" class="form-label" style="font-size: 12px; color: #64748b">OTP Code</label>
          <input
            type="text"
            formControlName="otp"
            class="form-control"
            placeholder="One time password"
            id="otp"
          />
        </div>

        <div style="padding: 0 10px; margin-bottom: 16px">
          <button
            type="button"
            class="btn btn-primary d-inline-flex justify-content-center align-items-center"
            style="background: #1a56db; width: 100%; height: 32px; font-size: 13px; font-weight: 500; gap: 6px;"
            (click)="updatePassword()"
          >
            Update Password <i class="bi bi-arrow-right pt-1"></i>
          </button>
        </div>
      }

    </form>

    <app-react-footer></app-react-footer>

    <div style="margin-top: 16px; padding-top: 15px; border-top: 0.5px solid #e2e8f0; font-size: 11px; text-align: center; color: #94a3b8">
      Protected by JWT. Session expires in 1 day
    </div>

  </div>
</div>
